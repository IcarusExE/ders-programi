<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yazılım Mühendisliği - Ders Programı</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a73e8">
</head>
<body>
    <div class="container">
        <header>
            <h1><span class="icon">📚</span> Yazılım Mühendisliği</h1>
            <div class="controls">
                <button id="printBtn" class="btn-secondary">Yazdır</button>
            </div>
        </header>

        <main class="schedule-grid">
            <div class="schedule-header">
                <span class="semester">2024-2055 Bahar Dönemi</span>
                <span class="week">36. Hafta</span>
            </div>

            <div id="coursesList" class="courses-list">
                <!-- Sabit dersler aşağıya yüklenecek -->
            </div>
        </main>
    </div>

    <template id="courseTemplate">
        <div class="course-card" draggable="false">
            <div class="course-color-indicator" style="background: var(--course-color);"></div>
            <div class="course-info">
                <h3 class="course-name" contenteditable="false"></h3>
                <p class="course-details" contenteditable="false"></p>
            </div>
        </div>
    </template>

    <script src="script.js"></script>
</body>
</html>
