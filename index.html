<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nallıhan MYO - Bilgisayar Programcılığı 1. Sınıf Ders Programı</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a73e8">
</head>
<body>
    <div class="container">
        <header>
            <h1><span class="icon">🏫</span> Nallıhan MYO</h1>
            <h2>Bilgisayar Programcılığı - 1. Sınıf</h2>
            <div class="controls">
                <button id="printBtn" class="btn-secondary">Yazdır</button>
                <button id="refreshBtn" class="btn-secondary">Yenile</button>
            </div>
        </header>

        <main class="schedule-grid">
            <div class="timetable-header">
                <span>Haftanın Programı</span>
                <span>2024-2055 Bahar Dönemi</span>
            </div>

            <div id="timetable" class="timetable"></div>
        </main>
    </div>

    <template id="courseBlock">
        <div class="course-block">
            <div class="course-info">
                <h3 class="course-name" contenteditable="false"></h3>
                <p class="course-instructor" contenteditable="false"></p>
            </div>
        </div>
    </template>

    <script src="script.js"></script>
</body>
</html>
